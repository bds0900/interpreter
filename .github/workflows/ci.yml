
name: Build and deploy GH Pages
on:
  push:
    branches:
      - v2
jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v2'
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
      - name: Install dioxus-cli
        run: CARGO_TARGET_DIR=`pwd`/target cargo install dioxus-cli --version 0.7.10

      - name: Build
        run: cd web && dx build --release --base-path /interpreter
      
      - name: Save wasm dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: interpreter-web-dist
          path: /home/runner/work/interpreter/interpreter/target/dx/web/release/web/public
          if-no-files-found: error
  
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download wasm dist artifact
        uses: actions/download-artifact@v8
        with:
          name: interpreter-web-dist
          path: public
        
      - name: Deploy
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: gh-pages
          build_dir: public
          keep_history: false
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
